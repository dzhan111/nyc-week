name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "scripts/validate.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # Called by research.yml. A push made with the default GITHUB_TOKEN does not
  # trigger other workflows, so the research job has to invoke this directly —
  # without this trigger the site would silently never update.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The build has no dependencies — deliberately no npm install here.
      - name: Build site
        run: node site/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
