name: Research week

on:
  schedule:
    # Thursdays at 11:00 UTC — ~7am ET in summer, ~6am ET in winter.
    # GitHub cron is UTC-only, so this drifts an hour across DST. That's fine here.
    - cron: "0 11 * * 4"
  workflow_dispatch:
    inputs:
      start:
        description: "Week start (YYYY-MM-DD). Defaults to today in New York."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Research the week
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.start }}" ]; then
            node scripts/fetch-week.mjs --start "${{ inputs.start }}"
          else
            node scripts/fetch-week.mjs
          fi

      - name: Commit the new week
        id: commit
        run: |
          git config user.name "nyc-week bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weeks
          if git diff --cached --quiet; then
            echo "No change to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add events for week of $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: research
    if: needs.research.outputs.changed == 'true'
    # A called workflow can only receive permissions the calling job holds, and
    # this workflow's top-level grant is contents-only. Without re-declaring
    # these here, the reusable deploy fails on a missing pages/id-token scope.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
